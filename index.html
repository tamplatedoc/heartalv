<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/favic.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTERALV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #0A192F;
            --light-blue: #64FFDA;
            --neon-blue: #00BFFF;
            --gray-light: #ccd6f6;
            --gray-dark: #8892b0;
        }

        body {
            background-color: var(--dark-blue);
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1518770660439-4630ee7ba2ba?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNTg3MDd8MHwxfHNlYXJjaHw3fHxmdXR1cmlzdGljJTIwdGVjaG5vbG9neXxlbnwwfHx8fDE2OTU5ODIyMjU&ixlib=rb-4.0.3&q=80&w=1080');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--gray-light);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 47, 0.9);
            z-index: 1;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 2.5em;
            text-shadow: 0 0 10px var(--neon-blue);
            position: relative;
            z-index: 2;
        }

        form {
            background-color: rgba(10, 25, 47, 0.8);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.2), 0 0 30px rgba(0, 191, 255, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        input, select {
            margin: 15px 0;
            padding: 15px;
            width: calc(100% - 30px);
            background: rgba(255, 255, 255, 0.05);
            color: var(--gray-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
        }

        input::placeholder {
            color: var(--gray-dark);
        }

        input:focus, select:focus {
            outline: none;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        }

        button {
            background-color: var(--neon-blue);
            color: var(--dark-blue);
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }

        button:hover {
            background-color: var(--light-blue);
            color: var(--dark-blue);
            box-shadow: 0 0 15px var(--light-blue);
            transform: translateY(-2px);
        }

        .link {
            margin-top: 20px;
            color: var(--gray-light);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .link:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .password-container {
            position: relative;
        }

        .password-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray-dark);
            transition: color 0.3s ease;
        }

        .password-container i:hover {
            color: var(--light-blue);
        }

        #registerSection, #loginSection {
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            form {
                padding: 30px;
            }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3VtggZ3POaniiW29w0a9hxpdL8tsT_B8",
            authDomain: "heartalv-bbb9f.firebaseapp.com",
            databaseURL: "https://heartalv-bbb9f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "heartalv-bbb9f",
            storageBucket: "heartalv-bbb9f.firebasestorage.app",
            messagingSenderId: "419949588771",
            appId: "1:419949588771:web:d0b4a4d2b3b2312b505c96",
            measurementId: "G-8RDRRPGWMW"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const fullName = document.getElementById('fullName').value;
                const gender = document.getElementById('gender').value;
                const age = document.getElementById('age').value;
                const whatsapp = document.getElementById('whatsapp').value;

                if (password !== confirmPassword) {
                    alert("Password tidak cocok!");
                    return;
                }

                try {
                    await addDoc(collection(db, "users"), {
                        username,
                        password,
                        fullName,
                        gender,
                        age,
                        whatsapp
                    });
                    alert("Pendaftaran berhasil!");
                } catch (error) {
                    console.error("Error adding document: ", error);
                }
            });

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const loginUsername = document.getElementById('loginUsername').value;
                const loginPassword = document.getElementById('loginPassword').value;

                const querySnapshot = await getDocs(collection(db, "users"));
                let userFound = false;

                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    if (userData.username === loginUsername && userData.password === loginPassword) {
                        userFound = true;
                        alert("Login berhasil!");
                        localStorage.setItem('userId', doc.id);
                        window.location.href = "dsb.html";
                    }
                });

                if (!userFound) {
                    alert("Username atau password salah!");
                }
            });

            const registerSection = document.getElementById('registerSection');
            const loginSection = document.getElementById('loginSection');

            document.querySelectorAll('.link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (link.getAttribute('href') === '#loginSection') {
                        registerSection.style.display = 'none';
                        loginSection.style.display = 'block';
                    } else {
                        loginSection.style.display = 'none';
                        registerSection.style.display = 'block';
                    }
                });
            });
        });
    </script>
</head>
<body>
    <div id="registerSection">
        <h1>Halaman Register</h1>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            <div class="password-container">
                <input type="password" id="password" placeholder="Password" required>
                <i id="passwordIcon" class="fas fa-eye" onclick="togglePasswordVisibility('password')"></i>
            </div>
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" required>
                <i id="confirmPasswordIcon" class="fas fa-eye" onclick="togglePasswordVisibility('confirmPassword')"></i>
            </div>
            <input type="text" id="fullName" placeholder="Nama Lengkap" required>
            <select id="gender" required>
                <option value="">Pilih Jenis Kelamin</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
            <input type="number" id="age" placeholder="Umur" required>
            <input type="text" id="whatsapp" placeholder="Nomer HP Whatsapp" required>
            <button type="submit">Daftar</button>
        </form>
        <a href="#loginSection" class="link">Sudah punya akun? Login di sini</a>
    </div>

    <div id="loginSection" style="display: none;">
        <h1>Halaman Login</h1>
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <div class="password-container">
                <input type="password" id="loginPassword" placeholder="Password" required>
                <i id="loginPasswordIcon" class="fas fa-eye" onclick="togglePasswordVisibility('loginPassword')"></i>
            </div>
            <button type="submit">Login</button>
        </form>
        <a href="#registerSection" class="link">Belum punya akun? Daftar di sini</a>
    </div>

    <script>
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + 'Icon');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
